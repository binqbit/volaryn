[package]
name = "volaryn-contract-tests"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.98"

[dev-dependencies]
anchor-lang.workspace = true
anchor-spl.workspace = true
bincode = "1.3"
litesvm = "=0.16.0"
solana-account = "4.3.0"
solana-address = "~2.6.1"
solana-clock = "~3.1.1"
solana-instruction = "3"
solana-keypair = "3.1.2"
solana-loader-v3-interface = { version = "8.0.1", features = ["wincode", "serde"] }
solana-message = "4.2.4"
solana-signer = "3.0.1"
solana-transaction = { version = "4.1.5", features = ["serde"] }
solana-transaction-error = "3"
system-interface = { package = "solana-system-interface", version = "2", features = ["bincode"] }
volaryn = { path = "../../programs/volaryn", features = ["no-entrypoint"] }
