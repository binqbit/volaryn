[workspace]
members = ["programs/volaryn", "tests/contract"]
resolver = "2"

[workspace.dependencies]
anchor-lang = "=1.0.2"
anchor-spl = { version = "=1.0.2", default-features = false, features = ["token", "token_2022"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
