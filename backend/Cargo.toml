[package]
name = "volaryn-backend"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.98"

[features]
default = []
localnet = []

[dependencies]
anchor-lang.workspace = true
anchor-spl.workspace = true
async-trait = "0.1"
axum = "=0.8.9"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "arbitrary_precision"] }
sha2 = "0.10"
solana-rpc-client = { version = "=4.2.2", default-features = false }
solana-rpc-client-api = "=4.2.2"
sqlx = { version = "=0.9.0", default-features = false, features = [
  "runtime-tokio",
  "postgres",
  "json",
  "tls-rustls-ring-webpki",
  "migrate",
  "macros",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net"] }
tower = { version = "0.5", features = ["limit", "util"] }
tower-http = { version = "=0.7.1", features = ["fs", "trace", "limit", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json"] }
utoipa = "=5.5.0"
utoipa-axum = "=0.2.0"
volaryn = { path = "../programs/volaryn", features = ["no-entrypoint"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[[bin]]
name = "volaryn"
path = "src/main.rs"

[[bin]]
name = "export-openapi"
path = "src/bin/export-openapi.rs"
