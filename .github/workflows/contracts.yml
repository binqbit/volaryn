name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  localnet:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: ./tools/test full
      - run: ./tools/release/build artifacts/release
      - run: docker run --rm "$(cat artifacts/release/image-id)" --help
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: volaryn-release-${{ github.sha }}
          path: artifacts/release/
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: localnet-test-evidence
          path: artifacts/tests/
          retention-days: 7
