<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1361px;height:653px;background:#101117;" width="1361px" height="653px" viewBox="0 0 1361 653" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8beta1?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="1361" height="653" fill="#101117" style="stroke:none;"/><g class="title" data-source-line="1"><text x="446.677" y="22.995" fill="#F3F0FF" font-size="14" textLength="460.763" font-weight="700">Volaryn | Stored agreement states and explicit transitions</text></g><g class="entity" data-qualified-name="Open" id="ent0001" data-source-line="20"><rect x="758.07" y="148.497" width="60.063" height="50" fill="#232333" style="stroke:#AA86F7;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="758.07" y1="175.958" x2="818.133" y2="175.958" style="stroke:#AA86F7;stroke-width:0.5;"/><text x="768.07" y="167.42" fill="#F3F0FF" font-size="15" textLength="40.063">Open</text></g><g class="entity" data-qualified-name="Active" id="ent0002" data-source-line="21"><rect x="422.77" y="318.687" width="66.663" height="50" fill="#232333" style="stroke:#AA86F7;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="422.77" y1="346.148" x2="489.433" y2="346.148" style="stroke:#AA86F7;stroke-width:0.5;"/><text x="432.77" y="337.61" fill="#F3F0FF" font-size="15" textLength="46.663">Active</text></g><g class="entity" data-qualified-name="Exercised" id="ent0003" data-source-line="22"><rect x="218.73" y="464.687" width="92.729" height="50" fill="#232333" style="stroke:#AA86F7;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="218.73" y1="492.148" x2="311.459" y2="492.148" style="stroke:#AA86F7;stroke-width:0.5;"/><text x="228.73" y="483.61" fill="#F3F0FF" font-size="15" textLength="72.729">Exercised</text></g><g class="entity" data-qualified-name="Cancelled" id="ent0004" data-source-line="23"><rect x="970.23" y="318.687" width="93.733" height="50" fill="#232333" style="stroke:#AA86F7;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="970.23" y1="346.148" x2="1063.963" y2="346.148" style="stroke:#AA86F7;stroke-width:0.5;"/><text x="980.23" y="337.61" fill="#F3F0FF" font-size="15" textLength="73.733">Cancelled</text></g><g class="entity" data-qualified-name="Expired" id="ent0005" data-source-line="24"><rect x="609.62" y="464.687" width="76.96" height="50" fill="#232333" style="stroke:#AA86F7;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="609.62" y1="492.148" x2="686.58" y2="492.148" style="stroke:#AA86F7;stroke-width:0.5;"/><text x="619.62" y="483.61" fill="#F3F0FF" font-size="15" textLength="56.96">Expired</text></g><g class="start_entity" data-qualified-name=".start." id="ent0006" data-source-line="25"><ellipse cx="788.1" cy="53.297" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN12" id="ent0013" data-source-line="31"><path d="M285.61,142.297 L285.61,204.68 A0,0 0 0 0 285.61,204.68 L722.582,204.68 A0,0 0 0 0 722.582,204.68 L722.582,177.497 L757.8,173.497 L722.582,169.497 L722.582,152.297 L712.582,142.297 L285.61,142.297 A0,0 0 0 0 285.61,142.297" style="stroke:#AA86F7;stroke-width:0.5;" fill="#292437"/><path d="M712.582,142.297 L712.582,152.297 L722.582,152.297 L712.582,142.297" style="stroke:#AA86F7;stroke-width:0.5;" fill="#292437"/><text x="291.61" y="161.22" fill="#E7E0F5" font-size="15" textLength="343.206">Deadline passage does not write a new state.</text><text x="291.61" y="178.681" fill="#E7E0F5" font-size="15" textLength="415.972">Open + closed acceptance = unavailable for matching.</text><text x="291.61" y="196.142" fill="#E7E0F5" font-size="15" textLength="325.605">Creator can still refund the original escrow.</text></g><g class="entity" data-qualified-name="GMN15" id="ent0016" data-source-line="36"><path d="M524.78,321.227 L524.78,339.687 L489.81,343.687 L524.78,347.687 L524.78,366.149 A0,0 0 0 0 524.78,366.149 L935.421,366.149 A0,0 0 0 0 935.421,366.149 L935.421,331.227 L925.421,321.227 L524.78,321.227 A0,0 0 0 0 524.78,321.227" style="stroke:#AA86F7;stroke-width:0.5;" fill="#292437"/><path d="M925.421,321.227 L925.421,331.227 L935.421,331.227 L925.421,321.227" style="stroke:#AA86F7;stroke-width:0.5;" fill="#292437"/><text x="530.78" y="340.15" fill="#E7E0F5" font-size="15" textLength="379.014">Active + elapsed expiry = awaiting writer reclaim.</text><text x="530.78" y="357.611" fill="#E7E0F5" font-size="15" textLength="389.641">Exercise is disabled, but stored status is still Active.</text></g><g class="entity" data-qualified-name="GMN18" id="ent0019" data-source-line="40"><path d="M6,575.687 L6,638.07 A0,0 0 0 0 6,638.07 L524.197,638.07 A0,0 0 0 0 524.197,638.07 L524.197,585.687 L514.197,575.687 L269.1,575.687 L265.1,515.117 L261.1,575.687 L6,575.687 A0,0 0 0 0 6,575.687" style="stroke:#AA86F7;stroke-width:0.5;" fill="#292437"/><path d="M514.197,575.687 L514.197,585.687 L524.197,585.687 L514.197,575.687" style="stroke:#AA86F7;stroke-width:0.5;" fill="#292437"/><text x="12" y="594.61" fill="#E7E0F5" font-size="15" textLength="258.545">Terminal records remain on chain.</text><text x="12" y="612.071" fill="#E7E0F5" font-size="15" textLength="497.197">cleanup_terminal() recovers residual USDC / settlement authority;</text><text x="12" y="629.532" fill="#E7E0F5" font-size="15" textLength="372.195">it does not delete Agreement or reopen the right.</text></g><!--link *start* to Open--><g class="link" data-entity-1="ent0006" data-entity-2="ent0001" id="lnk7" data-source-line="25" data-link-type="dependency"><path d="M788.1,63.577 C788.1,81.647 788.1,117.077 788.1,143.267" style="stroke:#2CE7B3;stroke-width:1;" fill="none" id="*start*-to-Open"/><polygon points="788.1,148.267,792.1,139.267,788.1,143.267,784.1,139.267,788.1,148.267" fill="#2CE7B3" style="stroke:#2CE7B3;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="789.1" y="108.22" fill="#F3F0FF" font-size="15" textLength="133.015">create_offer(side)</text></g><!--link Open to Active--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk8" data-source-line="26" data-link-type="dependency"><path d="M757.8,196.037 C752.12,199.347 746.08,202.407 740.1,204.687 C664.29,233.507 631.86,196.897 560.1,234.687 C522.33,254.577 493.19,289.248 475.02,314.508" style="stroke:#2CE7B3;stroke-width:1;" fill="none" id="Open-to-Active"/><polygon points="472.1,318.567,480.603,313.596,475.02,314.508,474.108,308.925,472.1,318.567" fill="#2CE7B3" style="stroke:#2CE7B3;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="604.752" y="249.61" fill="#F3F0FF" font-size="15" textLength="224.121">activate() or accept_request()</text><text x="575.276" y="267.071" fill="#F3F0FF" font-size="15" textLength="283.074">[opposite actor; now &lt; accept_before</text><text x="561.1" y="284.532" fill="#F3F0FF" font-size="15" textLength="311.426">and now &lt; expires_at; admission passes]</text></g><!--link Open to Cancelled--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk9" data-source-line="27" data-link-type="dependency"><path d="M818.33,193.017 C836.76,204.567 860.63,219.987 881.1,234.687 C919.06,261.947 957.06,292.597 984.17,315.057" style="stroke:#2CE7B3;stroke-width:1;" fill="none" id="Open-to-Cancelled"/><polygon points="988.02,318.247,983.641,309.425,984.17,315.057,978.538,315.585,988.02,318.247" fill="#2CE7B3" style="stroke:#2CE7B3;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1096.145" y="258.61" fill="#F3F0FF" font-size="15" textLength="102.927">cancel_offer()</text><text x="950.1" y="276.071" fill="#F3F0FF" font-size="15" textLength="395.017">[creator signs; also allowed after acceptance closes]</text></g><!--link Active to Exercised--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk10" data-source-line="28" data-link-type="dependency"><path d="M422.49,349.137 C372.